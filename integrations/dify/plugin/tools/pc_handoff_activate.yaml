                          - memory_citation
                          properties:
                            kind:
                              type: string
                              enum:
                              - memory
                            memory_citation:
                              type: object
                              additionalProperties: false
                              required:
                              - memory_ref
                              - entry_id
                              - entry_version_id
                              properties:
                                memory_ref:
