            - artifact_id
            - revision
            properties:
              family:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[\x21-\x7E]+$
              artifact_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[\x21-\x7E]+$
              revision:
                type: integer
                minimum: 1
          - type: 'null'
        content:
          type: object
          additionalProperties: false
          required:
          - schema
          - objective
          - state
          - disposition
          - next_action
          - omissions
          properties:
            generation:
              anyOf:
