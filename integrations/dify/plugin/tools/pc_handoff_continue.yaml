                additionalProperties: false
                description: Server-derived, persisted generation origin. Raw copied
                  metadata is not accepted as verified input without a valid receipt.
                  Prompt references are configuration lineage, not factual citations.
                required:
                - scope_id
                - prompt_key
                - selection
                - artifact
                - definition_version
                - builtin_version
                - compiled_digest
                - original_draft_digest
                - edit_status
                properties:
                  scope_id:
                    type: string
                    minLength: 1
                    maxLength: 256
                  prompt_key:
                    type: string
                    enum:
                    - handoff.generate
                  selection:
