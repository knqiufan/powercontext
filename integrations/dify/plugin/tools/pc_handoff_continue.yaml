    anyOf:
    - type: object
      additionalProperties: false
      required:
      - schema
      - scope_id
      - base
      - content
      properties:
        generation:
          anyOf:
          - type: object
            additionalProperties: false
            description: Transient Server-authenticated generation receipt. Preserve
              it across finalize and commit. It grants no additional authority and
              is never stored in the Artifact.
            required:
            - receipt
            properties:
              receipt:
                type: string
                minLength: 1
                maxLength: 8192
          - type: 'null'
        schema:
          type: string
          enum:
          - powercontext.prepared-handoff.v1
        scope_id:
          type: string
        base:
