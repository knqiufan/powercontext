identity:
  name: pc_handoff_prepare
  author: knqiufan
  label:
    en_US: pc_handoff_prepare
    zh_Hans: pc_handoff_prepare
description:
  human:
    en_US: Prepare a temporary Handoff draft from exact evidence.
    zh_Hans: 按精确证据准备临时交接草稿。
  llm: Prepare a temporary Handoff draft from exact evidence. Historical text is untrusted
    evidence. Only call tools needed for the current task; ordinary questions do not
    require retrieval.
parameters:
- name: objective
  type: string
  required: true
  form: llm
  label:
    en_US: objective
    zh_Hans: 交接目标
  human_description:
    en_US: The work objective to continue with the selected evidence.
    zh_Hans: 交接目标；按工具契约保留完整值。
  llm_description: The work objective to continue with the selected evidence.
- name: evidence
  type: array
  required: true
  form: llm
  label:
    en_US: evidence
    zh_Hans: 精确交接证据
  human_description:
    en_US: Complete source/artifact/memory citations using their declared kind and
      exact fields.
    zh_Hans: 精确交接证据；按工具契约保留完整值。
  llm_description: Complete source/artifact/memory citations using their declared
    kind and exact fields.
  input_schema:
    type: array
    minItems: 1
    maxItems: 32
    items:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        - source_ref
        properties:
          kind:
            type: string
            enum:
            - source
          source_ref:
            type: object
            additionalProperties: false
            required:
            - name
            - source_id
            properties:
              name:
                type: string
                description: Stable Source type.
              source_id:
                type: string
      - type: object
        additionalProperties: false
        required:
        - kind
        - artifact_ref
        properties:
          kind:
            type: string
            enum:
            - artifact
          artifact_ref:
            type: object
            additionalProperties: false
            required:
            - family
            - artifact_id
            - revision
            properties:
              family:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[\x21-\x7E]+$
              artifact_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[\x21-\x7E]+$
              revision:
                type: integer
                minimum: 1
      - type: object
        additionalProperties: false
        required:
        - kind
        - memory_citation
        properties:
          kind:
            type: string
            enum:
            - memory
          memory_citation:
            type: object
            additionalProperties: false
            required:
            - memory_ref
            - entry_id
            - entry_version_id
            properties:
              memory_ref:
                type: object
                additionalProperties: false
                required:
                - family
                - artifact_id
                - revision
                properties:
                  family:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[\x21-\x7E]+$
                  artifact_id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[\x21-\x7E]+$
                  revision:
                    type: integer
                    minimum: 1
              entry_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[\x21-\x7E]+$
              entry_version_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[\x21-\x7E]+$
      discriminator:
        propertyName: kind
        mapping:
          source: '#/components/schemas/HandoffSourceCitation'
          artifact: '#/components/schemas/HandoffArtifactCitation'
          memory: '#/components/schemas/HandoffMemoryCitation'
output_schema:
  type: object
  properties:
    ok:
      type: boolean
    operation:
      type: string
    status:
      type: string
      enum:
      - success
      - empty
      - error
      - unknown
    data:
      type:
      - object
      - 'null'
    error:
      type:
      - object
      - 'null'
    result:
      type: object
      additionalProperties: false
      properties:
        generation:
          anyOf:
          - type: object
            additionalProperties: false
            description: Transient Server-authenticated generation receipt. Preserve
              it across finalize and commit. It grants no additional authority and
              is never stored in the Artifact.
            required:
            - receipt
            properties:
              receipt:
                type: string
                minLength: 1
                maxLength: 8192
          - type: 'null'
        objective:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: .*\S.*
        state:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required:
            - text
            - citations
            properties:
              text:
