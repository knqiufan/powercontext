                      - memory_citation
                      properties:
                        kind:
                          type: string
                          enum:
                          - memory
                        memory_citation:
                          type: object
                          additionalProperties: false
                          required:
                          - memory_ref
                          - entry_id
                          - entry_version_id
                          properties:
                            memory_ref:
                              type: object
                              additionalProperties: false
                              required:
                              - family
                              - artifact_id
                              - revision
                              properties:
                                family:
                                  type: string
                                  minLength: 1
                                  maxLength: 128
                                  pattern: ^[\x21-\x7E]+$
                                artifact_id:
                                  type: string
                                  minLength: 1
                                  maxLength: 128
