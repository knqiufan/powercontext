                      - artifact_ref
                      properties:
                        kind:
                          type: string
                          enum:
                          - artifact
                        artifact_ref:
                          type: object
                          additionalProperties: false
                          required:
                          - family
                          - artifact_id
                          - revision
                          properties:
                            family:
                              type: string
                              minLength: 1
