                              pattern: ^[\x21-\x7E]+$
                            artifact_id:
                              type: string
                              minLength: 1
                              maxLength: 128
                              pattern: ^[\x21-\x7E]+$
                            revision:
                              type: integer
                              minimum: 1
                    - type: object
                      additionalProperties: false
                      required:
