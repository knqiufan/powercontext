                  pattern: .*\S.*
                citations:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                      - kind
                      - source_ref
                      properties:
                        kind:
                          type: string
                          enum:
                          - source
                        source_ref:
                          type: object
                          additionalProperties: false
                          required:
                          - name
                          - source_id
                          properties:
                            name:
                              type: string
                              description: Stable Source type.
                            source_id:
                              type: string
                    - type: object
                      additionalProperties: false
                      required:
